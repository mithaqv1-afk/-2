<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبتي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f3efe6;font-family:"Noto Naskh Arabic","Droid Arabic Naskh",Tahoma,Arial,sans-serif;overflow:hidden}

/* ===== القائمة الرئيسية ===== */
#home{height:100%;padding:5vh 6vw 4vh;display:flex;flex-direction:column;background:#0b1118}
#home h1{font-size:5vh;font-weight:700;margin-bottom:1vh}
#home p{font-size:2.6vh;color:#8d98a5;margin-bottom:4vh}
#grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:3vh 2.2vw}
.tile{background:#e9e4d8;color:#15191e;border-radius:1.2vh;border:.7vh solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.tile b{font-size:9vh;line-height:1;font-weight:700}
.tile span{font-size:3vh;margin-top:1vh}
.tile small{font-size:2.3vh;color:#5c6670;margin-top:1.2vh;min-height:3vh}
.tile.sel{transform:scale(1.07);border-color:#3fc1b0;box-shadow:0 0 0 .6vh #0b1118,0 0 4vh rgba(63,193,176,.55)}

/* ===== القارئ ===== */
#reader{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;display:none}
#scroller{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none}
#scroller::-webkit-scrollbar{display:none}
#cv{display:block;width:100%;height:auto;background:#fff}
#info{position:absolute;top:2vh;right:2vw;background:rgba(0,0,0,.78);padding:1.2vh 2vw;border-radius:1vh;font-size:3.2vh;opacity:0;transition:opacity .3s;pointer-events:none}
#hint{position:absolute;bottom:2vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);padding:1.2vh 2vw;border-radius:1vh;font-size:2.6vh;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4vh;text-align:center;max-width:80vw;line-height:1.7;display:none}
#goto{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#15191e;border:.6vh solid #3fc1b0;border-radius:2vh;padding:3vh 4vw;font-size:6vh;display:none}

/* ===== شبكة الصفحات ===== */
#ov{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(5,8,12,.96);display:none;flex-direction:column;padding:4vh 5vw}
#ov h2{font-size:4vh;margin-bottom:3vh}
#ovgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(10,1fr);gap:1.6vh 1vw;align-content:start;scrollbar-width:none}
#ovgrid::-webkit-scrollbar{display:none}
#ovgrid div{background:#1b222b;border:.5vh solid transparent;border-radius:1vh;text-align:center;font-size:3.4vh;padding:1.6vh 0;cursor:pointer}
#ovgrid div.sel{background:#e9e4d8;color:#15191e;border-color:#3fc1b0;transform:scale(1.12)}
</style>
</head>
<body>

<div id="home">
  <h1>مكتبتي</h1>
  <p>اختر الملف بالأسهم ثم اضغط OK</p>
  <div id="grid"></div>
</div>

<div id="reader">
  <div id="scroller"><canvas id="cv" width="10" height="10"></canvas></div>
  <div id="info"></div>
  <div id="hint">← الصفحة التالية &nbsp; → السابقة &nbsp; ▲▼ تمرير &nbsp; OK قائمة الصفحات &nbsp; أرقام: انتقال &nbsp; Back رجوع</div>
  <div id="msg"></div>
  <div id="goto"></div>
  <div id="ov">
    <h2>اختر الصفحة</h2>
    <div id="ovgrid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ======= الإعدادات ======= */
var BOOKS = 10;                       // عدد الملفات
function pdfPath(n){ return n + '.pdf'; }   // 1.pdf ... 10.pdf بنفس مجلد index.html
var RTL_BOOKS = true;                 // كتب عربية: اليسار = التالية
var JUMP = 10;                        // قفزة الصفحات السريعة

/* ======= الحالة ======= */
var $ = function(id){ return document.getElementById(id); };
var mode = 'home', sel = 0;
var pdf = null, book = 0, page = 1, total = 0;
var token = 0, loadId = 0, task = null;
var ovOpen = false, ovSel = 1;
var buf = '', bufTimer = null, infoTimer = null, hintTimer = null;

function store(k, v){
  try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){}
  return null;
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/* ======= القائمة الرئيسية ======= */
function buildHome(){
  var g = $('grid'); g.innerHTML = '';
  for(var i = 1; i <= BOOKS; i++){
    (function(n){
      var d = document.createElement('div'); d.className = 'tile';
      var p = store('p' + n);
      d.innerHTML = '<b>' + n + '</b><span>الملف</span><small>' + (p ? 'آخر صفحة: ' + p : '') + '</small>';
      d.onclick = function(){ sel = n - 1; openBook(n); };
      g.appendChild(d);
    })(i);
  }
  markSel();
}
function markSel(){
  var t = $('grid').children;
  for(var i = 0; i < t.length; i++) t[i].className = 'tile' + (i === sel ? ' sel' : '');
}

/* ======= فتح كتاب ======= */
function openBook(n){
  book = n; mode = 'reader';
  var my = ++loadId;
  $('home').style.display = 'none';
  $('reader').style.display = 'block';
  try{ history.pushState({r: 1}, ''); }catch(e){}
  showMsg('جاري تحميل الملف ' + n + ' ...');
  if(!window.pdfjsLib){ showMsg('تعذر تحميل مكتبة القراءة. تأكد من اتصال الإنترنت.'); return; }
  pdfjsLib.getDocument(pdfPath(n)).promise.then(function(doc){
    if(my !== loadId || mode !== 'reader'){ doc.destroy(); return; }
    pdf = doc; total = doc.numPages;
    buildOv();
    var saved = parseInt(store('p' + n), 10) || 1;
    go(Math.min(saved, total));
    showHint();
  }).catch(function(){
    if(my === loadId) showMsg('تعذر فتح الملف ' + pdfPath(n) + '<br>تأكد أنه مرفوع بنفس مكان index.html');
  });
}

function closeReader(){
  mode = 'home'; ovOpen = false; loadId++; token++;
  if(task){ try{ task.cancel(); }catch(e){} task = null; }
  $('ov').style.display = 'none';
  $('reader').style.display = 'none';
  $('goto').style.display = 'none'; buf = '';
  $('home').style.display = 'flex';
  if(pdf){ try{ pdf.destroy(); }catch(e){} pdf = null; }
  buildHome();
}

/* ======= عرض صفحة ======= */
function go(p, bottom){
  if(!pdf) return;
  p = Math.max(1, Math.min(total, p));
  var my = ++token; page = p; store('p' + book, p);
  showInfo();
  if(task){ try{ task.cancel(); }catch(e){} task = null; }
  pdf.getPage(p).then(function(pg){
    if(my !== token) return;
    var sc = $('scroller'), c = $('cv');
    var w = Math.min(window.innerWidth * Math.max(window.devicePixelRatio || 1, 1), 2200);
    var vp = pg.getViewport({scale: w / pg.getViewport({scale: 1}).width});
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    sc.scrollTop = bottom ? sc.scrollHeight : 0;
    task = pg.render({canvasContext: c.getContext('2d'), viewport: vp});
    return task.promise.then(function(){
      if(my !== token) return;
      task = null;
      $('msg').style.display = 'none';
      if(p < total) pdf.getPage(p + 1).catch(function(){});
    });
  }).catch(function(e){
    if(my === token && !(e && e.name === 'RenderingCancelledException')) showMsg('تعذر عرض الصفحة ' + p);
  });
}

function showMsg(t){ var m = $('msg'); m.innerHTML = t; m.style.display = 'block'; }
function showInfo(){
  var i = $('info');
  i.textContent = 'الملف ' + book + ' — صفحة ' + page + ' / ' + total;
  i.style.opacity = 1; clearTimeout(infoTimer);
  infoTimer = setTimeout(function(){ i.style.opacity = 0; }, 3000);
}
function showHint(){
  var h = $('hint'); h.style.opacity = 1; clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ h.style.opacity = 0; }, 7000);
}

/* ======= قائمة الصفحات ======= */
function buildOv(){
  var o = $('ovgrid'); o.innerHTML = '';
  for(var i = 1; i <= total; i++){
    (function(n){
      var d = document.createElement('div'); d.textContent = n;
      d.onclick = function(){ closeOv(); go(n); };
      o.appendChild(d);
    })(i);
  }
}
function openOv(){ ovOpen = true; ovSel = page; $('ov').style.display = 'flex'; markOv(); }
function closeOv(){ ovOpen = false; $('ov').style.display = 'none'; }
function markOv(){
  var ch = $('ovgrid').children;
  for(var i = 0; i < ch.length; i++) ch[i].className = (i + 1 === ovSel) ? 'sel' : '';
  if(ch[ovSel - 1]) ch[ovSel - 1].scrollIntoView({block: 'center'});
}

/* ======= الانتقال برقم ======= */
function commitGoto(){
  clearTimeout(bufTimer);
  var n = parseInt(buf, 10); buf = ''; $('goto').style.display = 'none';
  if(n) go(n);
}

/* ======= الريموت ======= */
function next(){ go(page + 1); }
function prev(){ go(page - 1); }

function onBack(){
  if(ovOpen){ closeOv(); return; }
  try{ history.back(); }catch(e){ closeReader(); }
}
window.addEventListener('popstate', function(){ if(mode === 'reader') closeReader(); });

document.addEventListener('keydown', function(e){
  var k = e.key, c = e.keyCode;
  var isBack = k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' || c === 4 || c === 27 || c === 8;
  var isOk = k === 'Enter' || c === 13 || c === 23;

  /* --- القائمة الرئيسية --- */
  if(mode === 'home'){
    if(k === 'ArrowLeft') sel = Math.min(BOOKS - 1, sel + 1);
    else if(k === 'ArrowRight') sel = Math.max(0, sel - 1);
    else if(k === 'ArrowDown'){ if(sel + 5 < BOOKS) sel += 5; }
    else if(k === 'ArrowUp'){ if(sel >= 5) sel -= 5; }
    else if(isOk){ e.preventDefault(); openBook(sel + 1); return; }
    else return;
    e.preventDefault(); markSel(); return;
  }

  /* --- القارئ --- */
  if(isBack){ e.preventDefault(); onBack(); return; }

  if(ovOpen){
    if(k === 'ArrowLeft') ovSel = Math.min(total, ovSel + 1);
    else if(k === 'ArrowRight') ovSel = Math.max(1, ovSel - 1);
    else if(k === 'ArrowDown') ovSel = Math.min(total, ovSel + 10);
    else if(k === 'ArrowUp') ovSel = Math.max(1, ovSel - 10);
    else if(isOk){ e.preventDefault(); closeOv(); go(ovSel); return; }
    else return;
    e.preventDefault(); markOv(); return;
  }

  if(!pdf) return;
  var sc = $('scroller');

  if(/^[0-9]$/.test(k)){
    e.preventDefault();
    buf += k; if(buf.length > 3) buf = buf.slice(-3);
    var g = $('goto'); g.textContent = 'صفحة: ' + buf; g.style.display = 'block';
    clearTimeout(bufTimer); bufTimer = setTimeout(commitGoto, 1600);
    return;
  }
  if(isOk){ e.preventDefault(); if(buf) commitGoto(); else openOv(); return; }

  if(k === 'ArrowLeft'){ e.preventDefault(); RTL_BOOKS ? next() : prev(); }
  else if(k === 'ArrowRight'){ e.preventDefault(); RTL_BOOKS ? prev() : next(); }
  else if(k === 'ArrowDown'){
    e.preventDefault();
    if(sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 6){ if(page < total) next(); }
    else sc.scrollTop += Math.round(sc.clientHeight * 0.8);
  }
  else if(k === 'ArrowUp'){
    e.preventDefault();
    if(sc.scrollTop <= 6){ if(page > 1) go(page - 1, true); }
    else sc.scrollTop -= Math.round(sc.clientHeight * 0.8);
  }
  else if(k === 'PageDown' || k === 'MediaFastForward' || c === 428 || c === 228){ e.preventDefault(); go(page + JUMP); }
  else if(k === 'PageUp' || k === 'MediaRewind' || c === 427 || c === 227){ e.preventDefault(); go(page - JUMP); }
});

buildHome();
</script>
</body>
</html>
